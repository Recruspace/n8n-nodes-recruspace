name: Semgrep SAST

on:
  pull_request:
  push:
    # Must name this repo's DEFAULT branch — see the note on `schedule` below.
    branches:
      - main
  # Periodic scan is the point of the evidence: a PR-only scan proves nothing about
  # code that was merged before the workflow existed. Mondays 03:00 UTC.
  #
  # NOTE: GitHub only fires `schedule` from the workflow file on the DEFAULT branch.
  # Until this file is merged there, the weekly run never happens at all and no
  # periodic-scan evidence accrues.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.head_ref || github.ref }}
  # Superseded PR pushes are worth cancelling; scheduled and main runs are the
  # evidence trail, so those queue instead of eating each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Community (OSS) registry ruleset. Pro/cross-file rules are not part of Semgrep CE.
  SEMGREP_RULES: p/default
  # Pinned on purpose: an unpinned scanner silently changes the finding count between
  # evidence periods, which makes the trend meaningless. Bump deliberately.
  SEMGREP_VERSION: '1.173.0'
  # No telemetry to the Semgrep registry beyond fetching the rules themselves.
  SEMGREP_SEND_METRICS: 'off'

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be silently repointed
      # by its owner, and this repo's own scan flags mutable refs. Trailing comment
      # carries the human-readable version.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Installed on the runner rather than run via the semgrep container image:
      # JS actions (checkout, upload-artifact) are unreliable inside that image's
      # musl base, and every step here needs to work the same way in 21 repos.
      - name: Install Semgrep
        run: pip install --disable-pip-version-check "semgrep==$SEMGREP_VERSION"

      # Not blocking yet: the first pass across the fleet will have a large untriaged
      # backlog. Flip this off once a baseline is agreed and findings are triaged.
      - name: Run Semgrep
        id: scan
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p semgrep-results
          # One scan, both formats: SARIF for tooling, JSON for the severity rollup.
          # --oss-only keeps the run honest about being Community Edition.
          semgrep scan \
            --config="$SEMGREP_RULES" \
            --oss-only \
            --metrics=off \
            --disable-version-check \
            --sarif-output=semgrep-results/semgrep.sarif \
            --json-output=semgrep-results/semgrep.json

      # `continue-on-error` above hides a crashed scan just as well as it hides
      # findings, so the run is classified here instead: findings stay green, a scan
      # that produced no parsable results fails the job loudly.
      - name: Summarize Findings
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys, collections

          def emit(text):
              # Written to both the job summary and the log: a reader who only has
              # one of the two should still see the whole verdict.
              print(text)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(text + "\n")

          path = "semgrep-results/semgrep.json"
          try:
              with open(path) as handle:
                  report = json.load(handle)
          except (OSError, json.JSONDecodeError) as exc:
              emit(f"## Semgrep SAST\n\n**No usable scan results ({exc}).** "
                   "Treat this run as no scan at all, not as a clean one.")
              sys.exit(1)

          # Semgrep emits both the legacy INFO/WARNING/ERROR scale and the newer
          # LOW..CRITICAL one depending on the rule, so normalize before counting.
          scale = {"INFO": "LOW", "WARNING": "MEDIUM", "ERROR": "HIGH"}
          results, errors = report.get("results", []), report.get("errors", [])
          counts = collections.Counter(
              scale.get(severity, severity)
              for severity in (
                  (finding.get("extra", {}).get("severity") or "UNKNOWN").upper()
                  for finding in results
              )
          )

          lines = [
              "## Semgrep SAST",
              "",
              f"Ruleset `{os.environ['SEMGREP_RULES']}` · "
              f"Semgrep {os.environ['SEMGREP_VERSION']} (Community Edition)",
              "",
              "| Severity | Findings |",
              "| --- | --- |",
          ]
          for level in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"):
              if counts.get(level):
                  lines.append(f"| {level.title()} | {counts[level]} |")
          lines.append(f"| **Total** | **{len(results)}** |")

          if errors:
              # Files semgrep could not fully parse went partly unscanned; a finding
              # count reported without this caveat overstates the coverage.
              lines += ["", f"{len(errors)} file(s) not fully analyzed:", ""]
              for err in errors[:10]:
                  message = (err.get("message") or "").splitlines() or ["no detail"]
                  lines.append(f"- `{err.get('path', '?')}` ({err.get('level', '?')}): {message[0]}")
              if len(errors) > 10:
                  lines.append(f"- ...and {len(errors) - 10} more")

          emit("\n".join(lines))
          PY

      # Deliberately no github/codeql-action/upload-sarif step: the Security tab needs
      # GitHub Advanced Security on private repos and returns 403 without it. The
      # artifact is the evidence — download it for the reporting period, do not rely
      # on retention.
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: semgrep-results/
          retention-days: 90
          if-no-files-found: warn
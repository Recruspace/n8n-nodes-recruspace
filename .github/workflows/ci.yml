name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      # `n8n-node lint` runs ESLint only and does not check formatting. Runs even when
      # lint failed, so one push reports both. Config lives in .prettierrc.js.
      - name: Run Prettier check
        if: ${{ !cancelled() }}
        run: 'npm run format:check'

      - name: Run build
        run: 'npm run build'
